<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="NatoMetrix: eina per a autòpsies fetals i perinatals (biometria, pesos d'òrgans, placenta, temps de mort).">
<link rel="icon" type="image/svg+xml" href="natometrix-logo.svg">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NatoMetrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/* Layout: banda de datos del caso arriba; dos columnas (entrada | resultados), que se apilan en móvil. Paleta H&E: hematoxilina (azul-violeta) como acento, eosina (rosa) para valores altos. */
:root{
  --bg:#f6f6f9; --surface:#ffffff; --sunk:#eeeef4; --fg:#1d1b2b; --muted:#5f5c74; --line:#dcdbe6;
  --hema:#3b3486; --hema-soft:#e7e5f6; --eosin:#b8326a; --eosin-soft:#fbe6ee;
  --low:#1f5fa8; --low-soft:#e3eefa; --warn:#946200; --warn-soft:#fbf0d6; --ok:#2d6a4f;
  --f-display:"Literata",Georgia,serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14131c; --surface:#1d1c28; --sunk:#262534; --fg:#ebe9f5; --muted:#a19eb8; --line:#363449;
  --hema:#a9a2f2; --hema-soft:#2c2950; --eosin:#f07aa8; --eosin-soft:#43192c; --low:#7fb3f0; --low-soft:#16304f;
  --warn:#e3b54f; --warn-soft:#3b2f12; --ok:#7cc9a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14131c; --surface:#1d1c28; --sunk:#262534; --fg:#ebe9f5; --muted:#a19eb8; --line:#363449;
  --hema:#a9a2f2; --hema-soft:#2c2950; --eosin:#f07aa8; --eosin-soft:#43192c; --low:#7fb3f0; --low-soft:#16304f;
  --warn:#e3b54f; --warn-soft:#3b2f12; --ok:#7cc9a0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;text-wrap:balance}
h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.u{text-transform:none;letter-spacing:0}
.brand{display:flex;align-items:center;gap:10px}
.sign{text-align:center;font-size:11px;color:var(--muted);font-style:italic;padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand .logo{width:40px;height:40px;flex:none}
.case [hidden],.frow.co[hidden]{display:none}
.privacy{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;padding:10px 14px;border:2px solid var(--eosin);border-radius:8px;background:var(--eosin-soft);font-size:13px}
.privacy b{color:var(--eosin)}
.privacy[hidden]{display:none}
.privacy .pi{flex:none;width:22px;height:22px;border-radius:50%;background:var(--eosin);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:14px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.src{color:var(--muted);font-size:12px;max-width:70ch}
.src em{font-style:normal;color:var(--fg)}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--hema)}
button.primary{background:var(--hema);border-color:var(--hema);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--hema);outline-offset:1px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.case{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px}
.case label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.ga{display:flex;gap:6px;align-items:center}
.ga input{width:64px}
input,select{font:inherit;font-family:var(--f-mono);font-size:13px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%;min-width:0}
input::placeholder{color:var(--muted);opacity:.7}
.grid{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.form{display:flex;flex-direction:column;gap:14px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 90px 62px;gap:8px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}
.frow:last-child{border-bottom:0}
.frow .lab{font-size:13px}
.frow .lab small{display:block;color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.photo[hidden]{display:none}
.plbox{border-top:1px solid var(--line);padding-top:10px}
.plbox summary{font-size:13px;letter-spacing:.06em}
.plgrid{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.plsel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,170px);gap:8px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line);font-size:13px}
.plstate{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:8px 10px;border:2px solid var(--eosin);border-radius:8px;background:var(--eosin-soft);font-size:13px;font-weight:600;margin:4px 0}
.plstate.fresh{border-color:var(--hema);background:var(--hema-soft)}
.plstate .seg button{font-size:12.5px;font-weight:600}
.plstate .seg button[aria-pressed="true"]{background:var(--eosin);color:var(--surface)}
.plstate.fresh .seg button[aria-pressed="true"]{background:var(--hema)}
.plsel.wide{grid-template-columns:minmax(0,1fr)}
.plsel[hidden]{display:none}
.frow[hidden]{display:none}
.sidein{display:flex;flex-direction:column;gap:1px;min-width:0}
.sidein .sl{font-size:10px;line-height:1.1;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbtn{display:inline-flex;align-items:center;gap:3px;margin-top:3px;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:600;cursor:pointer}
.vbtn:hover{background:var(--warn);color:var(--surface)}
.pend{display:inline-block;margin-left:6px;font-size:10.5px;padding:0 6px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-family:var(--f-body);font-weight:600}
.alert .abtn{margin-left:8px;font-size:12px;padding:2px 9px}
.tdgrp{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.tdgrp h4{margin:6px 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tdi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;font-size:12.5px;padding:2px 0;cursor:pointer}
.tdi input{width:auto;margin-top:2px}
.tdi .hr{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.tdi.weak span:nth-child(2){color:var(--muted)}
.tdi:has(input:checked) .hr{color:var(--eosin);font-weight:600}
.tdest{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--hema-soft);font-size:13px}
.tdest b{font-family:var(--f-mono)}
.tdest[hidden]{display:none}
.tdclin{display:flex;flex-direction:column;gap:2px;margin:6px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.tdclin h4{margin:4px 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tdclin input[type=datetime-local]{font-size:12px}
.tdclin .plsel{grid-template-columns:minmax(0,1fr) minmax(0,210px)}
.tdest.warn{background:var(--warn-soft)}
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1fr);gap:6px}
#pl_notes{width:100%;min-height:70px;font-family:var(--f-body);font-size:13px;background:var(--sunk);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.savecell{display:flex;flex-direction:column;gap:4px;justify-content:flex-end}
.savecell .st{font-size:11.5px;color:var(--muted);min-height:1.2em}
.savecell .st.dirty{color:var(--warn)}
.fmterr{font-size:11px;color:var(--eosin)}
.cases{margin-bottom:16px;border:2px solid var(--hema)}
.casesbtn{display:inline-flex;align-items:center;gap:6px;border-color:var(--hema);color:var(--hema);font-weight:600}
.casesbtn[aria-expanded="true"]{background:var(--hema);color:var(--surface)}
.casesbtn[hidden]{display:none}
.cases[hidden]{display:none}
.cases summary{font-size:14px;letter-spacing:0;text-transform:none;color:var(--fg);font-family:var(--f-display);font-weight:600}
.cases .inner{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.cases .search{max-width:320px}
.cases td button{font-size:12px;padding:3px 9px}
.cases td.act{display:flex;gap:6px;justify-content:flex-end}
.cases tr.cur td{background:var(--hema-soft)}
button.danger{border-color:var(--eosin);color:var(--eosin)}
.fx{display:inline-flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);cursor:pointer;margin-top:2px}
.fx input{width:auto;margin:0}
.fx:has(input:checked){color:var(--eosin);font-weight:500}
.chip{font-family:var(--f-mono);font-size:11px;text-align:center;border-radius:10px;padding:2px 4px;color:var(--muted);background:var(--sunk);white-space:nowrap}
.chip.hi{background:var(--eosin-soft);color:var(--eosin);font-weight:500}
.chip.lo{background:var(--low-soft);color:var(--low);font-weight:500}
.chip.bh,.chip.bl{background:var(--warn-soft);color:var(--warn)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,64px) 62px;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}
.pair .hd{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
details summary{cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:grid;grid-template-columns:6px minmax(0,1fr);gap:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.alert .bar{background:var(--muted)}
.alert.hi .bar{background:var(--eosin)} .alert.lo .bar{background:var(--low)} .alert.w .bar{background:var(--warn)}
.alert div:last-child{padding:7px 10px 7px 0}
.alert b{font-weight:600}
.empty{color:var(--muted);font-size:13px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1.5px solid var(--fg);vertical-align:bottom}
th:first-child,td:first-child{text-align:left}
td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{font-family:var(--f-body)}
td.sub{padding-left:22px;color:var(--muted)}
tr.na td{color:var(--muted)}
td.v-hi{color:var(--eosin);font-weight:600} td.v-lo{color:var(--low);font-weight:600} td.v-b{color:var(--warn)}
.note{font-size:12px;color:var(--muted);max-width:80ch}
.sechd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
textarea{width:100%;min-height:150px;font-family:var(--f-body);font-size:13px;background:var(--sunk);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;gap:4px;align-items:center}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.results{display:flex;flex-direction:column;gap:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;align-self:flex-start;flex-wrap:wrap}
.seg button{border:0;border-radius:0;padding:5px 10px;font-size:12px;background:var(--surface);color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--hema);color:var(--surface)}
.pairhint{font-size:11.5px;color:var(--muted);margin:-4px 0 0}
input[readonly]{background:transparent;border-style:dashed;color:var(--muted)}
input:disabled{opacity:.35;cursor:not-allowed}
.ctl{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:3px}
.ctl select{width:auto;max-width:100%;font-family:var(--f-body);font-size:11px;padding:1px 4px}
.ctl select.off{border-color:var(--eosin);color:var(--eosin)}
#notes{width:100%;min-height:110px;font-family:var(--f-body);font-size:13px;background:var(--sunk);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.colchips{display:flex;flex-wrap:wrap;gap:6px}
.colchip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:14px;font-size:12px;color:var(--muted)}
.colchip[aria-pressed="true"]{background:var(--hema-soft);border-color:var(--hema);color:var(--hema);font-weight:500}
.colchip .n{font-family:var(--f-mono);font-size:10.5px;min-width:16px;height:16px;border-radius:8px;background:var(--hema);color:var(--surface);display:inline-grid;place-items:center;padding:0 4px}
.copyopts{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{font-size:12px;padding:4px 10px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);cursor:pointer}
.chk input{width:auto}
.preview{font-family:var(--f-mono);font-size:12px;color:var(--fg);background:var(--sunk);padding:7px 9px;border-radius:5px;overflow-x:auto;white-space:nowrap}
.preview span{color:var(--muted)}
.photo{display:flex;flex-direction:column;gap:8px;background:var(--hema-soft);border-radius:8px;padding:12px}
.photo .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.photo input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo label.primary{background:var(--hema);color:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.photo label.primary:focus-within{outline:2px solid var(--hema);outline-offset:2px}
.photo p{margin:0;font-size:12px;color:var(--muted)}
.photo label.primary.off{opacity:.45;cursor:not-allowed}
.photo button.primary{background:var(--hema);color:var(--surface);border-color:var(--hema)}
#txtBox[hidden]{display:none!important}
.photo .status{font-size:12.5px;color:var(--fg)}
input.ai{background:var(--warn-soft);border-color:var(--warn)}
input.ai.unsure{background:var(--eosin-soft);border-color:var(--eosin)}
</style>
</head>
<body>
<script>
/* NatoMetrix standalone: no Claude, no storage of cases, no photo reading. */
window.NATOMETRIX_STANDALONE=true;
try{localStorage.removeItem("natometrix_cases_v1")}catch(e){}
window.claude={use:function(){return Promise.resolve(null)}};
</script>


<div class="wrap">
  <div class="top">
    <div>
      <div class="brand"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#3b3486"/><circle cx="25" cy="14.5" r="7.8" fill="#fff"/><path d="M18.6 18.6C12.2 22.6 10.6 31.6 15.2 36.8 19 41.2 26.4 41.8 31.2 38.4 35.4 35.4 36 29.6 32.6 26.6 30.6 24.8 28 24.4 26 23.6 24.6 23 23.6 21.8 23.2 21.2Z" fill="#fff"/><path d="M17.8 35.4C22.2 37 28.4 36 30.6 32.4 31.8 30.4 31 28.2 28.8 27.8" fill="none" stroke="#3b3486" stroke-width="1.5" stroke-linecap="round"/><path d="M24.4 24.2C22.2 25.4 21.4 28.2 22.8 30.2" fill="none" stroke="#3b3486" stroke-width="1.4" stroke-linecap="round"/><path d="M38.00 5.30L39.23 8.80L42.95 8.89L40.00 11.15L41.06 14.71L38.00 12.60L34.94 14.71L36.00 11.15L33.05 8.89L36.77 8.80Z" fill="#e3262f"/></svg><h1 data-t="title"></h1></div>
      <div class="src" data-h="src"></div>
    </div>
    <div class="btns">
      <button type="button" id="bCases" class="casesbtn" hidden aria-expanded="false" aria-controls="casesBox"></button>
      <div class="seg" role="group" aria-label="Idioma / Language"><button type="button" data-lang="ca" lang="ca">CA</button><button type="button" data-lang="es" lang="es">ES</button><button type="button" data-lang="en" lang="en">EN</button></div>
      <button id="bEx" type="button" data-t="ex"></button>
      <button id="bClr" type="button" data-t="clr"></button>
    </div>
  </div>

  <section class="panel cases" id="casesBox" hidden>
    <div class="sechd"><h2 id="casesSum"></h2><button type="button" id="bCasesClose" data-t="close"></button></div>
    <div class="inner">
      <p class="note" data-t="casesNote"></p>
      <input type="search" class="search" id="caseSearch" data-keep data-ph="searchPh" autocomplete="off">
      <div class="tw" id="caseList"></div>
    </div>
  </section>

  <div class="privacy" id="purgeBox" role="status" hidden><span class="pi" aria-hidden="true">!</span><div><span id="purgeTxt"></span> <button type="button" id="bPurge" class="danger"></button></div></div>
  <div class="privacy" role="note"><span class="pi" aria-hidden="true">!</span><div><b data-t="privH"></b> <span data-t="privT"></span></div></div>
  <div class="case" id="caseBand">
    <label><span data-t="caseNo"></span><input id="caseId" type="text" placeholder="N26-000139" autocomplete="off"><span class="fmterr" id="fmtErr" hidden></span></label>
    <label><span data-t="adate"></span><input id="adate" type="date"></label>
    <label><span data-t="resident"></span><input id="resident" type="text" autocomplete="off"></label>
    <label><span data-t="pathologist"></span><input id="pathologist" type="text" autocomplete="off"></label>
    <label><span data-t="ctypeL"></span><select id="ctype"><option value="" data-t="dash"></option><option value="ile" data-t="ctIle"></option><option value="mfiu" data-t="ctMfiu"></option><option value="neo" data-t="ctNeo"></option><option value="ab" data-t="ctAb"></option></select></label>
    <label><span data-t="gestL"></span><select id="gest"><option value="1" data-t="plT1"></option><option value="2" data-t="plT2"></option><option value="3" data-t="plT3"></option></select></label>
    <label id="chorL" hidden><span data-t="chorL"></span><select id="chor"><option value="" data-t="dash"></option><option value="dcda" data-t="chDCDA"></option><option value="mcda" data-t="chMCDA"></option><option value="mcma" data-t="chMCMA"></option><option value="tcta" data-t="chTCTA"></option><option value="dcta" data-t="chDCTA"></option><option value="mcta" data-t="chMCTA"></option></select></label>
    <label id="twinL" hidden><span data-t="twinL"></span><select id="twin"><option value="" data-t="dash"></option><option value="1" data-t="tw1"></option><option value="2" data-t="tw2"></option><option value="3" data-t="tw3"></option></select></label>
    <label id="tttsL" hidden><span data-t="tttsL"></span><select id="ttts"><option value="" data-t="dash"></option><option value="no" data-t="no"></option><option value="donor" data-t="ttD"></option><option value="recip" data-t="ttR"></option></select></label>

const L=()=>I18N[LANG];
const NM=k=>L().names[k];
const adj=(k,c)=>L().adj[c][L().gen[k]||GEN[k]];

const $=id=>document.getElementById(id);
const num=id=>{const e=$(id);if(!e)return null;const v=parseFloat(String(e.value).replace(",","."));return isFinite(v)?v:null};
const dec=s=>LANG==="en"?s:s.replace(".",",");

const fxHTML=k=>{const opts=PAIR.includes(k)?["ok","ltSides","lt","onlyR","onlyL","absent","notw"]:["ok","lt","absent","notw"];

function rowHTML(k,u,fx){return `<div class="frow"><span class="lab"><span data-n="${k}"></span>${k==="BW"?" (g)":""}<small id="e_${k}"></small>${fx?fxHTML(k):""}</span><input id="i_${k}" inputmode="decimal" placeholder="${u}"><span class="chip" id="c_${k}">—</span></div>`}
const pairHTML=k=>`<div class="pair"><span class="lab"><span data-n="${k}"></span><small id="e_${k}" style="display:block;color:var(--muted);font-size:11px;font-family:var(--f-mono)"></small>${fxHTML(k)}</span><label class="sidein"><span class="sl" data-sl="R" data-k="${k}"></span><input id="i_${k}R" inputmode="decimal" placeholder="g"></label><label class="sidein"><span class="sl" data-sl="L" data-k="${k}"></span><input id="i_${k}L" inputmode="decimal" placeholder="g"></label><label class="sidein"><span class="sl" data-sl="S" data-k="${k}"></span><input id="i_${k}" inputmode="decimal" placeholder="g"></label><span class="chip" id="c_${k}">—</span></div>`;
$("fOrg").innerHTML=ORDER.map(k=>PAIR.includes(k)?pairHTML(k):rowHTML(k,"g",1)).join("");
$("fBio").innerHTML=BIO.map(k=>rowHTML(k,UNIT[k])+(k==="BW"?`<div class="frow co" id="coRow1" hidden><span class="lab"><span data-t="coW1"></span> (g)<small id="e_co"></small></span><input id="co_w1" inputmode="decimal" placeholder="g"><span class="chip" id="c_co">—</span></div><div class="frow co" id="coRow2" hidden><span class="lab"><span data-t="coW2"></span> (g)</span><input id="co_w2" inputmode="decimal" placeholder="g"><span></span></div>`:"")).join("");
$("fOther").innerHTML=OTHER.map(k=>rowHTML(k,UNIT[k])).join("");
$("fBone").innerHTML=BONE.map(k=>rowHTML(k,"mm")).join("");

function ga(){const w=num("gaW");if(w==null)return null;return w+(num("gaD")||0)/7}
function ref(k,g){if(k==="penis"){if(g==null||g<16||g>38)return null;return{m:4.1754-0.2198*g+0.0212*g*g,sd:0.0097+0.0818*g}}
  const t=REF[k];if(!t||g==null)return null;const x=Math.min(42,Math.max(12,g))-12;const i=Math.min(29,Math.floor(x)),f=x-i;
  return{m:t[i][0]+(t[i+1][0]-t[i][0])*f,sd:t[i][1]+(t[i+1][1]-t[i][1])*f}}
function cdf(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2);let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function pct(z){const p=cdf(z)*100;return p<1?"<P1":p>99?">P99":"P"+Math.round(p)}
function eqGA(k,v){const t=REF[k];if(!t)return null;if(v<t[0][0])return"<12";if(v>t[30][0])return">42";
  for(let i=0;i<30;i++){if(v>=t[i][0]&&v<=t[i+1][0]){const g=12+i+(v-t[i][0])/(t[i+1][0]-t[i][0]);return dec(g.toFixed(1))}}return null}
const fmt=(v,d)=>v==null?"—":dec(Math.abs(v)>=100&&d==null?v.toFixed(0):v.toFixed(d??(Math.abs(v)<1?2:1)));
function cls(z,T){if(z==null)return"";if(z<=-T)return"lo";if(z>=T)return"hi";if(z<=-1.2816)return"bl";if(z>=1.2816)return"bh";return""}

let sumMode=false,LAST=null;
function pairTotal(k){if(!sumMode)return num("i_"+k);const r=num("i_"+k+"R"),l=num("i_"+k+"L");return r!=null&&l!=null?Math.round((r+l)*100)/100:null}
function syncSums(){if(!sumMode)return;for(const k of PAIR){if(st(k)!=="ok")continue;const v=pairTotal(k);$("i_"+k).value=v==null?"":String(v)}}
function setMode(on,init){if(on===sumMode&&!init)return;
  for(const k of PAIR){const t=$("i_"+k);
    if(on){if(!init)t.dataset.meas=t.value;t.readOnly=true}
    else{t.readOnly=false;if(!init)t.value=t.dataset.meas??""}}
  sumMode=on;store.set("sumMode",on);
  $("mMeas").setAttribute("aria-pressed",String(!on));$("mSum").setAttribute("aria-pressed",String(on));
  applyLang()}
const st=k=>$("st_"+k)?.value||"ok";
function value(k){if((ORG.includes(k)||PAIR.includes(k))&&st(k)!=="ok"&&st(k)!=="ltSides")return null;return PAIR.includes(k)?pairTotal(k):num("i_"+k)}
function applyStatus(){for(const k of [...ORG,...PAIR]){const s=st(k),d=(id,off)=>{const e=$(id);if(e)e.disabled=off};$("st_"+k).classList.toggle("off",s!=="ok");
  if(ORG.includes(k))d("i_"+k,s!=="ok");else{d("i_"+k+"R",!(s==="ok"||s==="onlyR"));d("i_"+k+"L",!(s==="ok"||s==="onlyL"));d("i_"+k,!(s==="ok"||s==="ltSides"))}}}

function syncGest(){$("ileRow").hidden=$("ctype").value!=="ile";const g=$("gest").value,multi=g!=="1",ch=$("chor").value;
  $("chorL").hidden=!multi;$("twinL").hidden=!multi;$("tttsL").hidden=!(multi&&ch.startsWith("mc"));
  $("coRow1").hidden=!multi;$("coRow2").hidden=g!=="3";
  [...$("chor").options].forEach(o=>{o.hidden=o.value!==""&&(g==="2"?o.value.endsWith("ta"):!o.value.endsWith("ta"))});
  [...$("twin").options].forEach(o=>{o.hidden=o.value==="3"&&g!=="3"});
  if($("pl_type").value!==g)$("pl_type").value=g}
function evalAll(){
  syncGest();applyStatus();syncSums();const g=ga(),T=parseFloat($("thr").value),res={};
  $("gaChip").textContent=g==null?"—":L().gaChip($("gaW").value,num("gaD")||0);
  for(const k of ALL){
    const v=value(k),r=ref(k,g),e=$("e_"+k),c=$("c_"+k);
    if(e)e.textContent=r?`${fmt(r.m)} ± ${fmt(r.sd)}`:"";
    let z=null;if(v!=null&&r&&r.sd>0)z=(v-r.m)/r.sd;
    res[k]={v,r,z,c:cls(z,T)};
    if(c){c.className="chip "+res[k].c;c.textContent=z==null?"—":pct(z)}
  }
  return{g,T,res}
}

function dysTerm(k,z){if(z==null)return"";const D=L().dys;if(k==="HC"){if(z<=-1.881)return D.micro;if(z>=1.881)return D.macro}if(k==="PL"){if(z<=-2)return D.shortPh;if(z>=2)return D.longPh}return""}
const COLK=["obs","msd","range","z","pct","eq","val"],SCREEN=COLK;
function mkRow(k,R,label){const x=R[k],r=x.r;
  const c={obs:fmt(x.v),mean:r?fmt(r.m):"—",sd:r?fmt(r.sd):"—",msd:r?fmt(r.m)+" ± "+fmt(r.sd):"—",
    range:r?fmt(Math.max(0,r.m-1.645*r.sd))+" – "+fmt(r.m+1.645*r.sd):"—",z:x.z==null?"—":fmt(x.z,2),pct:x.z==null?"—":pct(x.z),
    eq:r?eqGA(k,x.v)??"—":"—",val:x.z==null?"—":(dysTerm(k,x.z)||L().interp[x.c])};
  return{label:label||NM(k),unit:UNIT[k],c,cls:x.c}}
const isFx=k=>!!$("fx_"+k)?.checked;
const SCALE_MIN=0.1;
function ltEval(k){const r=ref(k,ga()),T=parseFloat($("thr").value);if(!r||!(r.sd>0))return{r:null,zmax:null,low:false};const zmax=(SCALE_MIN-r.m)/r.sd;return{r,zmax,low:zmax<=-T}}
function ltRow(k,label){const t=L(),{r,zmax,low}=ltEval(k);const lt="< "+fmt(SCALE_MIN,1);
  const pc=zmax==null||zmax>0?"—":(cdf(zmax)*100<1?"<P1":"< P"+Math.max(1,Math.round(cdf(zmax)*100)));
  return{label,unit:"g",cls:low?"lo":"",c:{obs:lt,mean:r?fmt(r.m):"—",sd:r?fmt(r.sd):"—",msd:r?fmt(r.m)+" ± "+fmt(r.sd):"—",range:r?fmt(Math.max(0,r.m-1.645*r.sd))+" – "+fmt(r.m+1.645*r.sd):"—",z:zmax==null||zmax>0?"—":"< "+fmt(zmax,2),pct:pc,eq:"—",val:low?t.interp.lo:t.notEval}}}
function orgRows(R){const out=[],t=L(),g=ga();
  for(const k of ORDER){const s=st(k);
    if(s==="lt"){out.push(ltRow(k,NM(k)+(PAIR.includes(k)?t.sfxMeas:"")+` (${t.txtLt})`+(isFx(k)?t.fxSfx:"")));continue}
    if(ORG.includes(k)){if(s==="absent")out.push({label:NM(k),c:{obs:t.tAbsent},na:1,note:t.txtAbsent});
      else if(s==="notw")out.push({label:NM(k),c:{obs:t.tNotw},na:1,note:""});
      else if(R[k].v!=null)out.push(mkRow(k,R,NM(k)+(isFx(k)?t.fxSfx:"")));continue}
    if(s==="absent"){out.push({label:NM(k),c:{obs:t.tAbsent},na:1,note:t.txtBil});continue}
    if(s==="notw"){out.push({label:NM(k),c:{obs:t.tNotw},na:1,note:""});continue}
    if(s==="onlyR"||s==="onlyL"){const w=num("i_"+k+(s==="onlyR"?"R":"L")),r=ref(k,g);
      out.push({label:`${NM(k)} (${s==="onlyR"?t.txtAgL:t.txtAgR})${isFx(k)?t.fxSfx:""}`,c:{obs:w==null?"—":fmt(w)},na:1,note:t.uni(r?fmt(r.m/2):"—")});continue}
    const r=num("i_"+k+"R"),l=num("i_"+k+"L"),lab=NM(k)+(sumMode?t.sfxSum:t.sfxMeas)+(isFx(k)?t.fxSfx:"");
    if(R[k].v!=null)out.push(mkRow(k,R,lab));
    else if(r!=null||l!=null)out.push({label:lab,c:{obs:"—"},na:1,note:sumMode?t.missSide:t.needTot});
    if(s==="ltSides"){out.push({label:sideLab(k,"R"),sub:1,na:1,c:{obs:"< "+fmt(SCALE_MIN,1)},note:t.txtLt},{label:sideLab(k,"L"),sub:1,na:1,c:{obs:"< "+fmt(SCALE_MIN,1)},note:t.txtLt});continue}
    if(r!=null)out.push({label:sideLab(k,"R"),sub:1,na:1,c:{obs:fmt(r)},note:l>0?t.quot(fmt(r/l,2)):t.noSideRef});
    if(l!=null)out.push({label:sideLab(k,"L"),sub:1,na:1,c:{obs:fmt(l)},note:""})}
  return out}
function bioRows(R){return[...BIO,...OTHER,...BONE].filter(k=>R[k].v!=null).map(k=>mkRow(k,R))}
function vcls(c){return c==="hi"?"v-hi":c==="lo"?"v-lo":c?"v-b":""}
function screenTable(id,rows){if(!rows.length){$(id).innerHTML=`<p class="empty">${L().empty}</p>`;return}
  const h=`<thead><tr><th>${L().param}</th>${SCREEN.map(k=>`<th>${L().short[k]}</th>`).join("")}</tr></thead>`;
  const b=rows.map(r=>`<tr${r.na?' class="na"':""}><td${r.sub?' class="sub"':""}>${r.label}${r.unit&&!r.sub?` (${r.unit})`:""}</td>`+
    (r.note!=null?`<td>${r.c.obs}</td><td colspan="${SCREEN.length-1}" style="text-align:left">${r.note}</td>`
      :SCREEN.map(k=>`<td${k==="val"?` class="${vcls(r.cls)}"`:""}>${esc(r.c[k])}</td>`).join(""))+"</tr>").join("");
  $(id).innerHTML=`<table>${h}<tbody>${b}</tbody></table>`}

function ratios(R,g){const out=[],t=L(),bw=R.BW.v,b=R.brain.v,l=R.liver.v;
  if(b!=null&&l!=null&&l>0){const exp=g!=null?ref("brain",g).m/ref("liver",g).m:null,v=b/l;
    out.push({n:t.rBL,v:fmt(v,2),e:exp?fmt(exp,2)+" (normal ≈ 3:1)":"≈ 3:1",ok:v>=4?"hi":"",t:v>=4?t.rBLhi:t.rOK})}
  const lu=R.lungs.v;
  if(lu!=null&&bw){const v=lu/bw,cut=g!=null&&g<28?0.015:0.012,exp=g!=null?ref("lungs",g).m/ref("BW",g).m:null;
    out.push({n:t.rLB,v:fmt(v,4),e:(exp?fmt(exp,4):"—")+` (${t.hypo(fmt(cut,3))})`,ok:v<cut?"lo":"",t:v<cut?t.rLBlo:t.rLBok})}
  if(R.CRL.v&&R.CHL.v){const v=R.CRL.v/R.CHL.v,exp=g!=null?ref("CRL",g).m/ref("CHL",g).m:null,bad=exp&&Math.abs(v-exp)>0.08;
    out.push({n:t.rCC,v:fmt(v,2),e:exp?fmt(exp,2):"≈ "+dec("0.67"),ok:bad?"bh":"",t:bad?t.rCCd:t.rCCok})}
  if($("gest").value!=="1"&&bw){const others=["co_w1","co_w2"].filter(id=>!$(id).closest(".frow").hidden).map(num).filter(x=>x!=null&&x>0);
    if(others.length){const all=[bw,...others],mx=Math.max(...all),mn=Math.min(...all),d=(mx-mn)/mx*100,big=d>=25,mid=d>=20&&!big;
      out.push({n:t.rDisc,v:`${fmt(d,1)} %`,e:"< 20–25 %",ok:big?"hi":mid?"bh":"",t:big?t.rDiscHi:mid?t.rDiscMid:t.rDiscOk,disc:1});
      out.push({n:t.rTwin,v:fmt(bw/others[0],2),e:"≈ 1",ok:"",t:t.rTwinT(fmt(bw),fmt(others[0]))})}}
  for(const k of ["heart","liver","thymus","spleen"]){const o=R[k].v;if(o==null||!bw||g==null)continue;
    out.push({n:t.rOB(NM(k)),v:fmt(o/bw*100,2),e:fmt(ref(k,g).m/ref("BW",g).m*100,2),ok:"",t:t.rOBt})}
  return out}

function render(){
  const {g,res:R}=evalAll(),t=L();
  LAST=R;screenTable("tOrg",orgRows(R));screenTable("tBio",bioRows(R));
  const rat=ratios(R,g);
  $("tRat").innerHTML=rat.length?`<table><thead><tr>${t.ratH.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rat.map(r=>`<tr><td>${r.n}</td><td class="${r.ok==="hi"?"v-hi":r.ok==="lo"?"v-lo":r.ok?"v-b":""}">${r.v}</td><td>${r.e}</td><td style="text-align:left;font-family:var(--f-body);white-space:normal">${r.t}</td></tr>`).join("")}</tbody></table>`:`<p class="empty">${t.ratEmpty}</p>`;

  const al=[];
  if(g==null)al.push({c:"w",t:t.noGA});else if(g<12||g>42)al.push({c:"w",t:t.outGA});
  for(const k of ALL){const x=R[k];if(x.c==="hi"||x.c==="lo")
    al.push({c:x.c,t:t.alert(NM(k),adj(k,x.c),`${fmt(x.v)} ${UNIT[k]}`,fmt(x.r.m),fmt(x.r.sd),fmt(x.z,2),esc(pct(x.z)),eqGA(k,x.v))+(dysTerm(k,x.z)?` → <b>${dysTerm(k,x.z)}</b>`:"")})}
  rat.filter(r=>r.ok==="hi"||r.ok==="lo").forEach(r=>al.push({c:"w",t:`<b>${r.n}</b> = ${r.v}. ${r.t}.`}));
  const PLc=plEval(R,g);plRender(PLc);al.push(...PLc.al);
  const TDc=tdEval();if(TDc)al.push({c:"w",t:`<b>${t.tdEstL}</b>: ${tdHours(TDc.h)} (${t["td_"+TDc.id]})`});
  const TDk=tdClinEval(TDc);const GRc=grEval(R,g,TDc);al.push(...GRc.al);if(TDk&&!TDk.bad){al.push({c:TDk.disc?"w":"",t:`<b>${t.tdClinL}</b>: ${durTxt(TDk.h)}${TDk.disc?" · "+t.tdDiscShort:""}`})}
  for(const k of ORDER){const s=st(k);if(s==="ok")continue;
    if(s==="ltSides"){al.push({c:"",t:`<b>${NM(k)}</b>: ${t.txtLtSides}`});continue}
    if(s==="lt"){const E=ltEval(k);al.push({c:E.low?"lo":"",t:t.ltA(NM(k),fmt(SCALE_MIN,1),E.r?fmt(E.r.m)+" ± "+fmt(E.r.sd):null,E.low)});continue}
    al.push({c:s==="notw"?"":"w",t:`<b>${NM(k)}</b>: ${s==="notw"?t.txtNotw:s==="absent"?(PAIR.includes(k)?t.txtBil:t.txtAbsent):s==="onlyR"?t.txtAgL:t.txtAgR}`})}
  const fxL=ORDER.filter(k=>isFx(k)&&R[k].v!=null);if(fxL.length)al.push({c:"",t:t.fixA(fxL.map(k=>NM(k).toLowerCase()).join(", "))});
  if($("mac").value)al.push({c:"",t:t.macA(t.macW[$("mac").value])});
  const nAlt=al.filter(a=>a.c==="hi"||a.c==="lo").length;
  const pend=document.querySelectorAll("input.ai").length;decorateAI();
  if(pend)al.unshift({c:"w",t:`<b>${t.vPend(pend)}</b><button type="button" class="abtn" id="vAll">${t.vAll}</button>`});
  $("alerts").innerHTML=(g!=null&&nAlt===0&&Object.values(R).some(x=>x.z!=null)?`<div class="alert"><span class="bar" style="background:var(--ok)"></span><div>${t.none}</div></div>`:"")+
    al.map(a=>`<div class="alert ${a.c}"><span class="bar"></span><div>${a.t}</div></div>`).join("");

  const X=t.txt,lc=s=>LANG==="en"||LANG==="es"||LANG==="ca"?s.charAt(0).toLowerCase()+s.slice(1):s;
  let s=X.sex[$("sex").value]+(g!=null?X.ga($("gaW").value,num("gaD")||0):"")+($("caseId").value?X.cas($("caseId").value):"")+".";
  if($("ctype").value)s+=" "+t.ctTxt[$("ctype").value]+".";
  if($("gest").value!=="1"){const sel=id=>$(id).value?$(id).options[$(id).selectedIndex].text:"";const parts=[t.gestTxt[$("gest").value]+($("chor").value?" "+sel("chor").toLowerCase():"")];
    if($("twin").value)parts.push(sel("twin").replace(/^./,c=>c.toLowerCase()));if(!$("tttsL").hidden&&$("ttts").value&&$("ttts").value!=="no")parts.push(t.tttsTxt(sel("ttts").toLowerCase()));
    const co=["co_w1","co_w2"].filter(id=>!$(id).closest(".frow").hidden).map(num).filter(x=>x!=null);if(co.length)parts.push(t.coTxt(co.map(x=>fmt(x)+" g").join(", ")));
    s+=" "+parts.join("; ").replace(/^./,c=>c.toUpperCase())+"."}
  const desc=k=>{const x=R[k],ex=[x.z!=null?pct(x.z):"",isFx(k)?t.fxNote:""].filter(Boolean).join("; ");return `${lc(NM(k))} ${fmt(x.v)} ${UNIT[k]}${ex?` (${ex})`:""}`};
  const bioL=[...BIO,...OTHER].filter(k=>R[k].v!=null);
  if(bioL.length)s+=`\n${X.bio}: ${bioL.map(desc).join("; ")}.`;
  const descSt=k=>{const s=st(k),n=lc(NM(k));if(s==="lt"){const E=ltEval(k);return `${n} < ${fmt(SCALE_MIN,1)} g (${t.txtLt}${E.low?"; "+t.interp.lo.toLowerCase():""})`}
    if(s==="ltSides"){const d=desc(k);return /\)$/.test(d)?d.replace(/\)$/,`; ${t.txtLtSides})`):`${d} (${t.txtLtSides})`}if(s==="notw")return `${n}: ${t.txtNotw}`;if(s==="absent")return `${n}: ${PAIR.includes(k)?t.txtBil:t.txtAbsent}`;
    const side=s==="onlyR"?"R":"L",w=num("i_"+k+side);return `${n}: ${s==="onlyR"?t.txtAgL:t.txtAgR}${w!=null?`, ${lc(sideLab(k,side))} ${fmt(w)} g`:""}${isFx(k)?` (${t.fxNote})`:""}`};
  const orgL=ORDER.filter(k=>R[k].v!=null||st(k)!=="ok");
  if(orgL.length)s+=`\n${orgL.some(isFx)?X.w0:X.w(t.freshW)}: ${orgL.map(k=>st(k)==="ok"?desc(k):descSt(k)).join("; ")}.`;
  const alt=ALL.filter(k=>R[k].c==="hi"||R[k].c==="lo");
  if(alt.length)s+=`\n${X.alt}: ${alt.map(k=>`${lc(NM(k))} ${adj(k,R[k].c)}`).join(", ")}.`;
  else if(g!=null&&(bioL.length||orgL.length))s+=`\n${X.none}`;
  rat.filter(r=>r.ok).forEach(r=>s+=r.disc?`\n${r.n}: ${r.v}. ${r.t}.`:`\n${X.ratio} ${lc(r.n)}: ${r.v}. ${r.t}.`);
  if(GRc.pattern)s+=`\n${GRc.pattern}.`;
  if(GRc.F&&GRc.F.term&&R.BW.v!=null)s+=`\n${t.grTxt(fmt(GRc.F.exp,0),fmt((R.BW.v-GRc.F.exp)/GRc.F.exp*100,1))}`;

function parseTxt(raw){const t=raw.trim();const out={vals:{},uns:new Set(),bad:[],status:{}};

    (j.uncertain||[]).forEach(k=>out.uns.add($(k)?k:TXT_KEYS[nk(k)]));return out}catch(e){}}
  const segs=t.split(/\n|\||;(?=\s*[^\d\s])/).map(x=>x.trim()).filter(Boolean);
  for(const seg of segs){const m=seg.match(/^[-*•\s]*([^:=]+?)\s*[:=]\s*(.+)$/);if(!m){out.bad.push(seg);continue}
    const id=TXT_KEYS[nk(m[1])];let v=m[2].trim();if(!id){out.bad.push(seg);continue}
    if(id==="_unsure"){v.split(/[,;\s]+/).map(nk).filter(Boolean).forEach(k=>{const f=TXT_KEYS[k];if(f)out.uns.add(f)});continue}
    if(id==="notes"||id==="caseId"||id==="pathologist"||id==="resident"){out.vals[id]=v;continue}
    if(id==="adate"){const d=v.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(d){const y=d[3].length===2?"20"+d[3]:d[3];out.vals.adate=`${y}-${d[2].padStart(2,"0")}-${d[1].padStart(2,"0")}`}else if(/^\d{4}-\d{2}-\d{2}$/.test(v))out.vals.adate=v;else out.bad.push(seg);continue}
    if(id==="sex"){const x=nk(v);out.vals.sex=/^(f|fem|dona|mujer|female)/.test(x)?"F":/^(m|masc|home|varon|hombre|male)/.test(x)?"M":/^(i|ind|und)/.test(x)?"I":"";if(!out.vals.sex){delete out.vals.sex;out.bad.push(seg)}continue}
    if(id==="_ga"){const g=v.match(/(\d{1,2})\s*(?:[+.,]|sem\w*|setm\w*|wk\w*)?\s*(\d)?/);if(g){out.vals.gaW=g[1];out.vals.gaD=g[2]||"0"}else out.bad.push(seg);continue}
    const org=id.match(/^i_(brain|heart|liver|spleen|thymus|lungs|kidneys|adrenals)(R|L)?$/);const vn=nk(v);
    if(org&&!org[2]){if(/^(nopesat|nopesado|notweighed|np)/.test(vn)){out.status[org[1]]="notw";continue}if(/^(absent|ausente|agenesi|agenesia)/.test(vn)){out.status[org[1]]="absent";continue}}
    if(org&&/^</.test(v)){out.status[org[1]]=org[2]?"ltSides":"lt";continue}
    const nm=v.replace(",",".").match(/(-?\d+(?:\.\d+)?)\s*(kg|g|mg|mm|cm|m)?\b/i);if(!nm){out.bad.push(seg);continue}
    let x=parseFloat(nm[1]);const u=(nm[2]||"").toLowerCase();
    if(MM_FIELDS.has(id)){if(u==="cm")x*=10;else if(u==="m")x*=1000}else{if(u==="kg")x*=1000;else if(u==="mg")x/=1000}
    out.vals[id]=Math.round(x*1000)/1000}
  return out}

  if(!CASES.length){box.innerHTML=`<p class="empty">${t.emptyList}</p>`;return}
  if(!rows.length){box.innerHTML=`<p class="empty">${t.noMatch}</p>`;return}
  const sx={M:t.sexM,F:t.sexF,I:t.sexI};
  box.innerHTML=`<table><thead><tr>${t.caseCols.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(c=>`<tr${c.n===curNum?' class="cur"':""}><td style="font-family:var(--f-mono)">${esc(c.n)}${c.fields?._ai?.length?`<span class="pend" title="${esc(t.vPend(c.fields._ai.length))}">${c.fields._ai.length} ✓?</span>`:""}</td><td>${c.fields?.adate?fmtDate(c.fields.adate):"—"}</td><td>${esc(sx[c.sex]||"—")}</td><td>${esc(c.ga||"—")}</td><td>${c.bw?esc(dec(String(c.bw)))+" g":"—"}</td><td style="white-space:normal">${esc(c.fields?.resident||"—")}</td><td style="white-space:normal">${esc(c.fields?.pathologist||"—")}</td><td>${fmtTime(c.savedAt)}</td><td class="act"><button type="button" data-open="${esc(c.n)}">${t.open}</button><button type="button" data-del="${esc(c.n)}">${t.del}</button></td></tr>`).join("")}</tbody></table>`}
$("caseList").addEventListener("click",e=>{const o=e.target.closest("[data-open]"),d=e.target.closest("[data-del]");
  if(o){const c=CASES.find(x=>x.n===o.dataset.open);if(!c)return;if(dirty&&c.n!==curNum)arm(o,"o"+c.n,L().openAnyway,()=>openCase(c));else openCase(c)}
  if(d)arm(d,"d"+d.dataset.del,L().sure,()=>delCase(d.dataset.del))});
$("caseSearch").addEventListener("input",drawCases);
(async()=>{try{if(!window.claude?.use)return;const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!user)return;
  const uid=await user.id();if(!uid)return;DB=db;UID=uid;
  drawCases();
  const w=await user.can("data.write").catch(()=>null);if(w===false){$("bSave").disabled=true;$("saveSt").textContent=L().readOnly}
  let timer=setTimeout(()=>{if(listState==="loading"){listState="slow";drawCases()}},10000);
  db.collection("data/users/"+uid).orderBy("savedAt","desc").limit(1000).onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer)}
    CASES=snap.docs.map(d=>({...d.data(),n:d.data()?.n||d.id}));listState="ok";drawCases();drawPurge()},
    err=>{clearTimeout(timer);listState="error";drawCases()})}catch(e){}})();
fill({...EX,caseId:L().exId});setMode(store.get("sumMode",false),true);dirty=false;
</script>
